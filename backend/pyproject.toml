[project]
name = "ashenspire-council-backend"
version = "0.1.0"
description = "Local voice-meeting API for the AshenSpire Council"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "openai>=1.107,<3",
  "openai-agents>=0.3,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
